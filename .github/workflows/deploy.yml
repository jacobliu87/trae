name: Deploy to CVM

on:
  push:
    branches: [ "main" ]

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_REPO: ${{ secrets.DOCKER_HUB_REPO }}
  CVM_HOST: ${{ secrets.CVM_HOST }}
  CVM_USER: ${{ secrets.CVM_USER }}

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO }}:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO }}:${{ github.sha }}

  deploy-to-cvm:
    name: Deploy to CVM
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.CVM_SSH_KEY }}
          known_hosts: ${{ secrets.CVM_KNOWN_HOSTS }}

      - name: Deploy to CVM
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.CVM_USER }}@${{ secrets.CVM_HOST }} << 'EOF'
            # 拉取最新镜像
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO }}:latest
            
            # 停止并删除旧容器
            docker stop trae-app || true
            docker rm trae-app || true
            
            # 启动新容器
            docker run -d \
              --name trae-app \
              --restart unless-stopped \
              -p 80:80 \
              ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO }}:latest
            
            # 清理未使用的镜像
            docker image prune -f
          EOF